<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pago Móvil - CloudPark</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/pago-movil.css">
</head>
<body class="bg-app">
    <main class="mobile-container">
        
        <header class="app-header">
            <a href="dashboard.html" class="btn-volver">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            </a>
            <div class="header-titulo">
                <h2>Caja Virtualk</h2>
                <p>Liquidar Estancia</p>
            </div>
            <div style="width: 40px;"></div>
        </header>

        <section class="panel-monitoreo">
            <p class="etiqueta-tiempo">Tiempo Estacionado</p>
            <div id="reloj-tiempo" class="reloj-neon">00:00</div>
            
            <div class="monto-pagar" id="monto-total">
                $0.00 <span style="font-size: 1rem; color: var(--text-muted); font-weight: 400;">MXN</span>
            </div>
        </section>

        <form id="form-pago-simulado" class="formulario-pago" onsubmit="event.preventDefault();">
            <h3 style="margin-bottom: 1rem; font-size: 1.1rem; color: #fff; display: flex; align-items: center; gap: 8px;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
                Método de Pago
            </h3>
            
            <div class="campo-input-wrapper">
                <label style="color: var(--text-muted); font-size: 0.85rem; font-weight: 600;">SELECCIONA TU TARJETA</label>
                <select id="selector-tarjetas" style="width: 100%; padding: 14px; border-radius: 10px; background: rgba(0,0,0,0.5); border: 1px solid var(--border-dark); color: white; margin-top: 8px; font-size: 1rem; appearance: none; outline: none;">
                    <option value="">Cargando tus tarjetas...</option>
                </select>
            </div>
            
            <div id="alerta-sin-tarjetas" class="oculto" style="margin-top: 15px; padding: 12px; background: rgba(255, 149, 0, 0.1); border: 1px solid #FF9500; border-radius: 8px; color: #FF9500; font-size: 0.9rem; text-align: center;">
                No tienes tarjetas guardadas. <br>
                <a href="perfil.html" style="color: #FF9500; font-weight: bold; text-decoration: underline; margin-top: 5px; display: inline-block;">Agrega una en tu perfil</a>
            </div>

            <button type="submit" id="btn-procesar-pago" class="btn-pagar" style="margin-top: 1.5rem;" disabled>Pagar y Liberar Salida</button>
        </form>

    </main>

    <script type="module" src="../js/pago-movil.js"></script>
</body>
</html>
