<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inicio - Parkil</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="icon" type="image/png" href="../icono-parkil.png?v=3">
    <!-- Leaflet para el Mapa de Estacionamientos del Conductor -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        .leaflet-container { background: #09090b !important; border-radius: 16px; }
        .leaflet-tile-pane { filter: invert(100%) hue-rotate(180deg) brightness(92%) contrast(90%); }
        .tarjeta-mapa-sedes {
            background: var(--surface);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 1.2rem;
            margin-bottom: 1.8rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .lista-sedes-cards {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 12px;
        }
        .sede-item {
            background: #000000;
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .sede-item.activa {
            border-color: #0A84FF;
            background: rgba(10, 132, 255, 0.12);
            box-shadow: 0 0 15px rgba(10, 132, 255, 0.25);
        }
        .sede-item h4 { margin: 0; font-size: 0.95rem; color: #fff; }
        .sede-item p { margin: 2px 0 0; font-size: 0.75rem; color: var(--text-muted); }
        .badge-tarifa {
            background: rgba(50, 215, 75, 0.15);
            color: #32D74B;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 0.8rem;
            white-space: nowrap;
        }
    </style>
</head>
<body class="bg-app">
    <main class="mobile-container">
        <header class="app-header">
            <div class="perfil-usuario">
                <div class="avatar" id="avatar-logo-parkil"></div>
                <div class="info-perfil">
                    <p>Bienvenido a Parkil,</p>
                    <h2 id="nombre-usuario">Cargando...</h2>
                </div>
            </div>

            <div style="display: flex; gap: 10px; align-items: center;">
                <a href="admin.html" id="btn-ir-admin" class="btn-cerrar oculto" title="Panel Administrador" style="border-color: #0A84FF; color: #0A84FF;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                </a>
                <a href="perfil.html" class="btn-cerrar" title="Mi Perfil">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                </a>
                <button id="btn-salir" class="btn-cerrar" title="Cerrar Sesión">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                </button>
            </div>
        </header>

        <section class="app-content">
            <!-- Placa Registrada -->
            <div class="banner-info" style="margin-bottom: 1.5rem; background-color: rgba(255, 255, 255, 0.04); border: 1px dashed var(--card-border);">
                <div class="icono-banner" style="color: #0A84FF;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="8" rx="2" ry="2"></rect><circle cx="7" cy="12" r="1"></circle><circle cx="17" cy="12" r="1"></circle></svg>
                </div>
                <div class="texto-banner">
                    <strong style="color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px;">Vehículo Autorizado</strong>
                    <p id="placa-usuario" style="color: #0A84FF; font-size: 1.3rem; font-weight: 800; font-family: 'Courier New', Courier, monospace; letter-spacing: 2px; margin-top: 2px;">CARGANDO...</p>
                </div>
            </div>

            <!-- NUEVO MÓDULO: MAPA DE ESTACIONAMIENTOS EN LA PLATAFORMA -->
            <h4 class="titulo-seccion">📍 Estacionamientos Cercanos</h4>
            <div class="tarjeta-mapa-sedes">
                <div id="mapa-conductor" style="height: 210px; width: 100%; border: 1px solid var(--card-border);"></div>
                <div id="lista-estacionamientos-ui" class="lista-sedes-cards"></div>
            </div>

            <!-- Botón Principal para ir al Plano de Cajones del Estacionamiento Elegido -->
            <a href="reservas.html" class="tarjeta-principal" id="btn-reservar-principal">
                <div class="texto-principal">
                    <h3 id="titulo-reservar-sede">Reservar cajón</h3>
                    <p id="subtitulo-reservar-sede">Ver mapa de niveles y disponibilidad</p>
                </div>
                <div class="icono-principal" id="icono-carro-parkil"></div>
            </a>

            <h4 class="titulo-seccion">Tus accesos</h4>
            <div class="fila-secundaria">
                <a href="ticket.html" class="tarjeta-secundaria" id="tarjeta-ticket">
                    <div class="icono-secundario">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line><path d="M8 14h.01"></path><path d="M12 14h.01"></path><path d="M16 14h.01"></path></svg>
                    </div>
                    <span class="texto-secundario">Ver Código</span>
                </a>

                <a href="pago-movil.html" class="tarjeta-secundaria">
                    <div class="icono-secundario">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
                    </div>
                    <span class="texto-secundario">Pagar Salida</span>
                </a>
            </div>
        </section>
    </main>

    <script type="module" src="../js/dashboard.js"></script>
</body>
</html>
