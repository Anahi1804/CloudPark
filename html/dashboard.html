<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inicio - Virtual Station</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body class="bg-app">
    <main class="mobile-container">
        
        <header class="app-header">
            <div class="perfil-usuario">
                <div class="avatar">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                </div>
                <div class="info-perfil">
                    <p>Buenas tardes,</p>
                    <h2 id="nombre-usuario">Cargando...</h2>
                </div>
            </div>
            <button id="btn-salir" class="btn-cerrar" title="Cerrar Sesión">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            </button>
            
        </header>

        <section class="app-content">

<!-- Nueva tarjeta de Vehículo Registrado -->
            <div class="banner-info" style="margin-bottom: 2rem; background-color: rgba(255, 255, 255, 0.05); border: 1px dashed var(--border-dark);">
                <div class="icono-banner" style="color: var(--text-muted);">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="8" rx="2" ry="2"></rect><circle cx="7" cy="12" r="1"></circle><circle cx="17" cy="12" r="1"></circle></svg>
                </div>
                <div class="texto-banner">
                    <strong style="color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px;">Vehículo Autorizado</strong>
                    <p id="placa-usuario" style="color: var(--spot-selected); font-size: 1.4rem; font-weight: 800; font-family: 'Courier New', Courier, monospace; letter-spacing: 2px; margin-top: 4px;">CARGANDO...</p>
                </div>
            </div>
            
            <a href="reservas.html" class="tarjeta-principal">
                <div class="texto-principal">
                    <h3>Reservar cajón</h3>

                    
                    <p>Selecciona tu espacio</p>
                </div>
                <div class="icono-principal">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 16H9m10 0h3v-3.15a1 1 0 0 0-.84-.99L16 11l-2.7-3.6a2 2 0 0 0-1.6-.8H7.3a2 2 0 0 0-1.6.8L3 11l-5.16.86a1 1 0 0 0-.84.99V16h3m14 0a2 2 0 1 1-4 0 2 2 0 0 1 4 0ZM7 16a2 2 0 1 1-4 0 2 2 0 0 1 4 0Z"></path></svg>
                </div>
            </a>

            <h4 class="titulo-seccion">Tus accesos</h4>

            <div class="fila-secundaria">
                <a href="ticket.html" class="tarjeta-secundaria" id="tarjeta-ticket">
                    <div class="icono-secundario">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line><path d="M8 14h.01"></path><path d="M12 14h.01"></path><path d="M16 14h.01"></path><path d="M8 18h.01"></path><path d="M12 18h.01"></path><path d="M16 18h.01"></path></svg>
                    </div>
                    <span class="texto-secundario">Ver Código</span>
                </a>

                <a href="pago-movil.html" class="tarjeta-secundaria">
                    <div class="icono-secundario">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
                    </div>
                    <span class="texto-secundario">Pagar Salida</span>
                </a>
            </div>

            <div class="banner-info">
                <div class="icono-banner">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                </div>
                <div class="texto-banner">
                    <strong>Acceso automatizado</strong>
                    <p>Tu código interactúa directamente con los sensores de la pluma.</p>
                </div>
            </div>

        </section>
    </main>

    <script type="module" src="../js/dashboard.js"></script>
</body>
</html>
