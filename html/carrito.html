<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar Reserva - Virtual Station</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/carrito.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">Virtual Station</div>
        <a href="reservas.html" class="link-volver">← Volver al mapa</a>
    </header>

    <main class="contenedor-carrito">
        <section class="detalle-reserva">
            <h2>Detalles del Paquete</h2>
            <table class="tabla-resumen">
                <tbody>
                    <tr>
                        <td>Cajón seleccionado:</td>
                        <td><strong id="resumen-cajon">--</strong></td>
                    </tr>
                    <tr>
                        <td>Usuario:</td>
                        <td id="resumen-usuario">--</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <section class="configuracion-pago">
            <div class="ajuste-tiempo" style="flex-direction: column; align-items: flex-start; gap: 10px;">
                <label for="select-paquete" style="font-weight: bold;">Selecciona tu paquete de tiempo:</label>
                
                <select id="select-paquete" style="width: 100%; font-size: 1.1rem; padding: 12px; border-radius: 8px; border: 1px solid var(--border);">
                    <option value="" disabled selected>Elige una opción...</option>
                    <option value="30" data-precio="15.00">⚡ Express - 30 minutos ($15.00)</option>
                    <option value="60" data-precio="25.00">🚗 Estándar - 1 hora ($25.00)</option>
                    <option value="120" data-precio="45.00">💼 Reunión - 2 horas ($45.00)</option>
                    <option value="240" data-precio="80.00">🏢 Máximo - 4 horas ($80.00)</option>
                </select>
            </div>
            
            <div class="total-caja" style="margin-top: 1.5rem;">
                <span>Total a pagar hoy:</span>
                <strong id="monto-total">$0.00 MXN</strong>
            </div>
            
            <button id="btn-finalizar" class="btn-accion" disabled>Pagar y Generar Código</button>
        </section>
    </main>

    <script src="../js/carrito.js"></script>
</body>
</html>
