<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Confirmar Reserva - CloudPark</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/carrito.css">
</head>
<body class="bg-app">
    <main class="mobile-container layout-fluido">
        
        <header class="app-header">
            <a href="reservas.html" class="btn-volver" title="Volver al mapa">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            </a>
            <div class="header-titulo">
                <h2>Confirmar Pago</h2>
                <p>Completa tu reserva</p>
            </div>
            <div style="width: 40px;"></div> 
        </header>

        <div class="layout-carrito">
            <section class="tarjeta-oscura">
                <h3 class="titulo-seccion">Detalles del Paquete</h3>
                
                <div class="info-fila">
                    <span class="info-etiqueta">Cajón asignado:</span>
                    <strong class="info-valor cyan-glow" id="resumen-cajon">--</strong>
                </div>
                <div class="divisor-oscuro"></div>
                <div class="info-fila">
                    <span class="info-etiqueta">Usuario:</span>
                    <span class="info-valor" id="resumen-usuario">--</span>
                </div>
            </section>

            <section class="tarjeta-oscura seccion-pago">
                <div class="grupo-input">
                    <label for="select-paquete">Selecciona tu paquete de tiempo:</label>
                    <div class="select-wrapper">
                        <select id="select-paquete" class="select-dark">
                            <option value="" disabled selected>Elige una opción...</option>
                            <option value="30" data-precio="15.00">⚡ Express - 30 min ($15.00)</option>
                            <option value="60" data-precio="25.00">🚗 Estándar - 1 hora ($25.00)</option>
                            <option value="120" data-precio="45.00">💼 Reunión - 2 horas ($45.00)</option>
                            <option value="240" data-precio="80.00">🏢 Máximo - 4 horas ($80.00)</option>
                        </select>
                        <div class="select-flecha">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </div>
                    </div>
                </div>
                
                <div class="caja-total">
                    <span class="etiqueta-total">Total a pagar hoy:</span>
                    <strong id="monto-total" class="monto-neon">$0.00 MXN</strong>
                </div>

                <div class="resumen-caja" style="margin-top: 1.5rem;">
                    <h2 style="font-size: 1.1rem; color: #fff; margin-bottom: 1rem; display: flex; align-items: center; gap: 8px;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
                        Método de Pago
                    </h2>
                    
                    <div class="campo-input-wrapper">
                        <label style="color: var(--text-muted); font-size: 0.85rem; font-weight: 600;">SELECCIONA TU TARJETA</label>
                        <select id="selector-tarjetas" style="width: 100%; padding: 14px; border-radius: 10px; background: rgba(0,0,0,0.5); border: 1px solid var(--border-dark); color: white; margin-top: 8px; font-size: 1rem; appearance: none; outline: none;">
                            <option value="">Cargando tus tarjetas...</option>
                        </select>
                    </div>
                    
                    <div id="alerta-sin-tarjetas" class="oculto" style="margin-top: 15px; padding: 12px; background: rgba(255, 149, 0, 0.1); border: 1px solid #FF9500; border-radius: 8px; color: #FF9500; font-size: 0.9rem; text-align: center;">
                        No tienes tarjetas guardadas. <br>
                        <a href="perfil.html" style="color: #FF9500; font-weight: bold; text-decoration: underline; margin-top: 5px; display: inline-block;">Agrega una en tu perfil</a>
                    </div>
                </div>
                
                <button id="btn-finalizar-compra" class="btn-neon" style="width: 100%; margin-top: 1.5rem;" disabled>Pagar y Generar Código</button>
            </section>
        </div>
    </main>

    <script type="module" src="../js/carrito.js"></script>
</body>
</html>
