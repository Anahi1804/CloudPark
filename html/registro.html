<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Registro - CloudPark</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="bg-app">
    <main class="mobile-container layout-auth">
        
        <div class="contenedor-auth">
            <header class="auth-header">
                <div class="logo-icon-grande">
                    <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><line x1="19" y1="8" x2="19" y2="14"></line><line x1="22" y1="11" x2="16" y2="11"></line></svg>
                </div>
                <h1>Nueva Cuenta</h1>
                <p>Únete a CloudPark</p>
            </header>

            <form id="formulario-registro" class="form-dark" onsubmit="event.preventDefault();">
                
                <div class="campo-input-wrapper">
                    <label for="reg-nombre">Nombre de Usuario</label>
                    <div class="input-con-icono">
                        <svg class="icono-input" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        <input type="text" id="reg-nombre" placeholder="Ej. Luna Keb" required>
                    </div>
                </div>

                <div class="campo-input-wrapper">
                    <label for="reg-placa">Placa del Vehículo</label>
                    <div class="input-con-icono">
                        <svg class="icono-input" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="8" rx="2" ry="2"></rect><circle cx="7" cy="12" r="1"></circle><circle cx="17" cy="12" r="1"></circle></svg>
                        <input type="text" id="reg-placa" placeholder="YZA-1234" style="text-transform: uppercase;" required>
                    </div>
                </div>

                <div class="campo-input-wrapper">
                    <label for="reg-correo">Correo Electrónico</label>
                    <div class="input-con-icono">
                        <svg class="icono-input" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                        <input type="email" id="reg-correo" placeholder="nombre@correo.com" required>
                    </div>
                </div>
                
                <div class="campo-input-wrapper">
                    <label for="reg-password">Contraseña</label>
                    <div class="input-con-icono" style="position: relative;">
                        <svg class="icono-input" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        
                        <input type="password" id="password" placeholder="Mínimo 6 caracteres" minlength="6" required>
                        
                        <div id="btn-ojito-login" style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-muted);">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </div>
                    </div>
                    
                    <div style="text-align: right; margin-top: 8px;">
                        <a href="#" id="link-recuperar" style="color: var(--spot-selected); font-size: 0.85rem; text-decoration: none; font-weight: 600;">¿Olvidaste tu contraseña?</a>
                    </div>
                </div>
                
                <button type="submit" class="btn-neon btn-grande">Crear Cuenta</button>
            </form>
            
            <div id="mensaje-registro" class="mensaje-terminal oculto"></div>

            <div style="margin-top: 1.5rem; text-align: center;">
                <p style="color: var(--text-muted); font-size: 0.9rem;">
                    ¿Ya tienes cuenta? <a href="../index.html" style="color: var(--spot-selected); text-decoration: none; font-weight: bold;">Inicia sesión aquí</a>
                </p>
            </div>

        </div>
    </main>

    <script type="module" src="../js/registro.js"></script>
</body>
</html>
