<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Acceso al Estacionamiento - Virtual Station</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/caseta.css">
</head>
<body class="body-terminal">
    <main class="contenedor-terminal">
        <header class="header-terminal">
            <div class="logo-terminal">Virtual Station</div>
            <h1>Caseta de Entrada</h1>
            <p>Ingresa el código de tu ticket para abrir la pluma</p>
        </header>

        <section class="seccion-validacion">
            <div class="campo-codigo">
                <label for="codigo-input">Código de Reservación:</label>
                <input type="text" id="codigo-input" placeholder="PARK-XXXX" autocapitalize="characters" autocomplete="off" maxlength="10">
            </div>

            <button id="btn-validar" class="btn-accion btn-grande">Validar y Abrir Pluma</button>
        </section>

        <div id="mensaje-estado" class="mensaje-terminal oculto">
            <div class="icono-estado"></div>
            <p id="texto-estado"></p>
        </div>
    </main>

    <script src="../js/acceso-entrada.js"></script>
</body>
</html>
