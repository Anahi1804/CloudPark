<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reservar Lugar - Virtual Station</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/reservas.css">
</head>
<body class="bg-app">
    <main class="mobile-container layout-fluido">
        
        <header class="app-header">
            <a href="dashboard.html" class="btn-volver" title="Volver">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            </a>
            <div class="header-titulo">
                <h2>Mapa de Cajones</h2>
                <p>Selecciona tu espacio</p>
            </div>
            <button id="btn-salir" class="btn-cerrar" title="Cerrar Sesión">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            </button>
        </header>

        <div class="layout-reservas">
            <section class="estacionamiento tarjeta-oscura">
                
                <div class="indicadores">
                    <span class="tag disponible"><div class="punto"></div> Disponible</span>
                    <span class="tag ocupado"><div class="punto"></div> Ocupado</span>
                    <span class="tag seleccionado"><div class="punto"></div> Selección</span>
                </div>
                
                <div id="contenedor-cajones" class="grid-estacionamiento">
                    <div class="cajon disponible">
                        <span class="numero-cajon">A1</span>
                    </div>
                    <div class="cajon ocupado">
                        <span class="numero-cajon">A2</span>
                    </div>
                    <div class="cajon disponible">
                        <span class="numero-cajon">A3</span>
                    </div>
                <div class="cajon disponible">
                    <span class="numero-cajon">B1</span>
                </div>
                <div class="cajon ocupado">
                    <span class="numero-cajon">B2</span>
                </div>
                <div class="cajon disponible">
                    <span class="numero-cajon">B3</span>
                </div>
            </div>
        </section>

        <aside class="panel-control tarjeta-oscura">
            <h3 class="titulo-panel">Detalles de Reserva</h3>
            
            <div id="info-cajon" class="info-box">
                <p class="etiqueta-info">Estado actual:</p>
                <p class="valor-info" style="font-size: 1.2rem; color: var(--text-muted);">Esperando selección...</p>
            </div>

            <button id="btn-ir-carrito" class="btn-accion btn-neon" disabled>Continuar al Pago</button>
        </aside>
        </div>
    </main>

    <script type="module" src="../js/reservas.js"></script>
</body>
</html>
