<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - CloudPark</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#8A2BE2">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icono.png">
</head>
<body class="bg-app">
    <main class="mobile-container layout-auth">
        
        <div class="contenedor-auth">
            <header class="auth-header">
                <div class="logo-icon-grande">
                    <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 16H9m10 0h3v-3.15a1 1 0 0 0-.84-.99L16 11l-2.7-3.6a2 2 0 0 0-1.6-.8H7.3a2 2 0 0 0-1.6.8L3 11l-5.16.86a1 1 0 0 0-.84.99V16h3m14 0a2 2 0 1 1-4 0 2 2 0 0 1 4 0ZM7 16a2 2 0 1 1-4 0 2 2 0 0 1 4 0Z"></path></svg>
                </div>
                <h1>CloudPark</h1>
                <p>Acceso al Sistema de Estacionamiento</p>
            </header>

            <form id="formulario-login" class="form-dark" onsubmit="event.preventDefault();">
                <div class="campo-input-wrapper">
                    <label for="usuario">Correo Electrónico</label>
                    <div class="input-con-icono">
                        <svg class="icono-input" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                        <input type="text" id="usuario" placeholder="nombre@gmail.com" required>
                    </div>
                </div>
                
                <div class="campo-input-wrapper">
                    <label for="password">Contraseña</label>
                    <div class="input-con-icono" style="position: relative;">
                        <svg class="icono-input" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        
                        <input type="password" id="password" placeholder="••••••••" required>
                        
                        <div id="btn-ojito-login" style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-muted);">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </div>
                    </div>
                    
                    <div style="text-align: right; margin-top: 8px;">
                        <a href="#" id="link-recuperar" style="color: var(--spot-selected); font-size: 0.85rem; text-decoration: none; font-weight: 600;">¿Olvidaste tu contraseña?</a>
                    </div>
                </div>
                
                <button type="submit" class="btn-neon btn-grande">Ingresar al Sistema</button>
            </form>


            <div style="margin-top: 1.5rem; text-align: center;">
                <p style="color: var(--text-muted); font-size: 0.9rem;">
                    ¿Eres nuevo? <a href="html/registro.html" style="color: var(--spot-selected); text-decoration: none; font-weight: bold;">Regístrate gratis</a>
                </p>
            </div>
            
            <div id="mensaje-error" class="mensaje-terminal error oculto">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                <p>Credenciales incorrectas. Intenta de nuevo.</p>
            </div>
        </div>

    </main>


    <script>
        console.log("¡HOLA DESDE EL HTML! Si ves esto, JavaScript sí funciona aquí.");
    </script>
    

    <script type="module" src="js/auth.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('PWA Lista! Service Worker registrado.', reg.scope))
                    .catch(err => console.error('Error en Service Worker', err));
            });
        }
    </script>
</body>
</html>
